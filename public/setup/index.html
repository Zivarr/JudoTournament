<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opzethandleiding - Judo Tournament</title>
  <link rel="stylesheet" href="/shared/styles/base.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }

    .page-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .page-header h1 { font-size: 1.2rem; }
    .header-right { display: flex; align-items: center; gap: 1rem; }

    .main-content {
      flex: 1;
      padding: 1.5rem;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
    }

    .section-title {
      font-size: 0.7rem;
      font-weight: 800;
      font-family: var(--font-display);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-top: 2rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
    }

    /* Server URL box */
    .server-url-card {
      background: var(--surface);
      border: 1px solid var(--info);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .server-url-label {
      font-size: 0.8rem;
      color: var(--muted);
      font-family: var(--font-display);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.25rem;
    }

    .server-url-value {
      font-size: 1.35rem;
      font-weight: 800;
      font-family: var(--font-display);
      color: var(--info);
      letter-spacing: 0.03em;
    }

    .server-url-note {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    /* Per-tatami cards */
    .tatami-setup-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .tatami-setup-header {
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 1rem;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .tatami-setup-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }

    .setup-device {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      text-align: center;
    }

    .setup-device:first-child {
      border-right: 1px solid var(--border);
    }

    .setup-device-icon { font-size: 1.6rem; }

    .setup-device-label {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .setup-device-url {
      font-family: monospace;
      font-size: 0.9rem;
      color: var(--text);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.3rem 0.6rem;
      word-break: break-all;
    }

    .setup-qr {
      border-radius: 6px;
      overflow: hidden;
      border: 3px solid #fff;
      line-height: 0;
      background: #fff;
    }

    .setup-qr img {
      display: block;
      width: 140px;
      height: 140px;
    }

    .setup-device-hint {
      font-size: 0.78rem;
      color: var(--muted);
      max-width: 200px;
    }

    /* Organisation mini-cards */
    .org-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 0.75rem;
    }

    .org-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      text-decoration: none;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transition: background 0.15s, border-color 0.15s;
    }

    .org-card:hover {
      background: var(--surface2);
      border-color: var(--info);
      text-decoration: none;
    }

    .org-card-icon { font-size: 1.4rem; }

    .org-card-info {}
    .org-card-label {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .org-card-url { font-size: 0.75rem; color: var(--muted); font-family: monospace; }

    /* Checklist */
    .checklist {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
    }

    .checklist-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.9rem;
      cursor: pointer;
      padding: 0.3rem 0;
      border-radius: 4px;
      transition: background 0.1s;
    }

    .checklist-item:hover { background: var(--surface2); padding-left: 0.4rem; }

    .checklist-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      accent-color: var(--success);
      cursor: pointer;
    }

    .checklist-item.checked { color: var(--muted); text-decoration: line-through; }

    /* No tournament banner */
    .no-tournament-banner {
      background: var(--surface);
      border: 1px solid var(--warning);
      border-radius: var(--radius);
      padding: 1rem 1.5rem;
      text-align: center;
      color: var(--warning);
      font-weight: 600;
      margin-bottom: 1rem;
    }

    @media (max-width: 520px) {
      .tatami-setup-body { grid-template-columns: 1fr; }
      .setup-device:first-child { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <div class="page-header">
    <h1>🗺 <span data-i18n="setup">Opzethandleiding</span></h1>
    <div class="header-right">
      <a href="/" class="btn btn-sm">← Home</a>
      <div class="lang-toggle">
        <button class="lang-btn" id="langNl" onclick="switchLang('nl')">NL</button>
        <button class="lang-btn" id="langEn" onclick="switchLang('en')">EN</button>
      </div>
    </div>
  </div>

  <div class="main-content">

    <!-- Server URL -->
    <div class="section-title" data-i18n="serverUrl">Server URL</div>
    <div class="server-url-card">
      <div>
        <div class="server-url-label" data-i18n="serverUrl">Server URL</div>
        <div class="server-url-value" id="serverUrlValue">…</div>
        <div class="server-url-note" data-i18n="networkNote">Alle apparaten moeten op hetzelfde WiFi-netwerk zitten</div>
      </div>
      <button class="btn btn-sm" id="copyUrlBtn" onclick="copyServerUrl()">
        <span data-i18n="copy">Kopiëren</span>
      </button>
    </div>

    <!-- No tournament warning -->
    <div id="noTournamentBanner" class="no-tournament-banner" style="display:none">
      <span data-i18n="noTournament">Geen toernooi aangemaakt</span> — <a href="/admin/">Ga naar beheer</a>
    </div>

    <!-- Per-tatami section -->
    <div class="section-title" id="tatamiSectionTitle" style="display:none">Tatami</div>
    <div id="tatamiSetupList"></div>

    <!-- Organisation -->
    <div class="section-title" data-i18n="organisation">Organisatie</div>
    <div class="org-grid">
      <a href="/admin/" class="org-card">
        <div class="org-card-icon">⚙️</div>
        <div class="org-card-info">
          <div class="org-card-label" data-i18n="admin">Beheerder</div>
          <div class="org-card-url">/admin/</div>
        </div>
      </a>
      <a href="/overview/" class="org-card">
        <div class="org-card-icon">📊</div>
        <div class="org-card-info">
          <div class="org-card-label" data-i18n="overview">Overzicht</div>
          <div class="org-card-url">/overview/</div>
        </div>
      </a>
    </div>

    <!-- Checklist -->
    <div class="section-title" data-i18n="checklist">Checklist dag van het toernooi</div>
    <div class="checklist" id="checklist"></div>

  </div>

  <script type="module" src="/setup/setup.js"></script>
</body>
</html>
